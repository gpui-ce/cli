[package]
name = "gpui-ce-cli"
version = "0.1.0"
edition = "2024"
description = "Development CLI for GPUI-CE applications"
readme = "README.md"
keywords = ["gpui", "gui", "hot-reload", "cli"]
categories = ["command-line-utilities", "development-tools"]
license = "Apache-2.0"
repository = "https://github.com/gpui-ce/cli"

[[bin]]
name = "gpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ar = "0.9"
axum = { version = "0.8", features = ["ws"] }
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
notify = "8"
object = { version = "0.37", features = ["write"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
subsecond-types = "=0.7.10"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
walkdir = "2"
